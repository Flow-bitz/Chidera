<!DOCTYPE html>
<html>

    <head>
        <title>Student Registration Form</title>
    </head>

    <body>

        <h1>Student Registration</h1>

        <form action="about.html" method="get">

            <label for="fullname">Full Name</label><br>

            <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required>

            <br><br>

            <label for="email">Email</label><br>

            <input
            type="email"
            id="email"
            name="email"
            required>

            <br><br>

            <label for="password">Password</label><br>

            <input
            type="password"
            id="password"
            name="password"
            required>

            <br><br>

            <p>Gender</p>

            <input
            type="radio"
            name="gender"
            value="Male"> Male

            <input
            type="radio"
            name="gender"
            value="Female"> Female

            <br><br>

            <label>Country</label>

            <select name="country">

            <option>Nigeria</option>

            <option>Ghana</option>

            <option>Kenya</option>

            </select>

            <br><br>

            <label>About Yourself</label><br>

            <textarea
            rows="5"
            cols="40">
            </textarea>

            <br><br>

            <input
            type="submit"
            value="Register">

            <input
            type="reset">

        </form>

    </body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>Tables</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Location</th>
        </tr>

        <tr>
            <td>John</td>
            <td>16</td>
            <td>Portharcourt</td>
        </tr>

        <tr>
            <td>Mary</td>
            <td>15</td>
            <td>Lagos</td>
        </tr>

        <tr>
            <td>Maxwell</td>
            <td>17</td>
            <td>Abuja</td>
        </tr>
    </table>

    <br><br>

    <h2>Span</h2>
    <h3>Column Span</h3>

    <table border="1">

        <tr>
            <th colspan="3">Information</th>
        </tr>

        <tr>
            <th>Student</th>
            <th colspan="2">Info</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Location</th>
        </tr>

        <tr>
            <td>John</td>
            <td>16</td>
            <td>Portharcourt</td>
        </tr>

        <tr>
            <td>Mary</td>
            <td>15</td>
            <td>Lagos</td>
        </tr>

        <tr>
            <td>Maxwell</td>
            <td>17</td>
            <td>Abuja</td>
        </tr>
    </table>
    <br>

    <h3>Row Span</h3>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Subject</th>
        </tr>

        <tr>
            <td rowspan="2">John</td>
            <td>Maths</td>
        </tr>

        <tr>
            <td>English</td>
        </tr>

        <tr>
            <td>James</td>
            <td>Science</td>
        </tr>
    </table>

</body>
</html>
